  /* ============ 收入：保存 ============ */
  function saveIncomeFromSheet(){
    var name = (nameInput.value || '').trim();
    var amount = parseFloat(amountInput.value) || 0;

    if(!name){
      nameInput.classList.add('err');
      nameInput.focus();
      return false;
    }
    nameInput.classList.remove('err');

    if(editingIncomeId){
      var rec = findIncomeById(editingIncomeId);
      if(rec){
        rec.icon = selectedIcon;
        if(isOneTimeIncome(rec)){
          rec.amount = round2(amount);
          generateIncomeLedger(rec, todayDateKey(), Date.now());
        } else {
          var day = parseInt(dayInput.value, 10) || 0;
          if(day < 1 || day > 31){
            dayInput.classList.add('err');
            dayInput.focus();
            return false;
          }
          dayInput.classList.remove('err');

          var wasAuto = rec.day > 0;
          rec.amount = round2(amount);
          rec.day = day;
          if(!wasAuto){
            rec.lastSettledDate = todayDateKey();
          }
        }
      }
    } else {
      var day = 0;
      if(isFixedIncomeOn){
        day = parseInt(dayInput.value, 10) || 0;
        if(day < 1 || day > 31){
          dayInput.classList.add('err');
          dayInput.focus();
          return false;
        }
        dayInput.classList.remove('err');
      }

      var newRec = {
        id: 'in' + Date.now() + Math.floor(Math.random() * 1000),
        name: name,
        amount: round2(amount),
        day: day,
        received: 0,
        createdAt: todayDateKey(),
        lastSettledDate: todayDateKey(),
        lastResetMonth: '',
        icon: selectedIcon
      };

      if(day === 0){
        generateIncomeLedger(newRec, todayDateKey(), Date.now());
      }
      newRec.lastSettledDate = todayDateKey();
      demoIncome.push(newRec);
    }

    saveIncome();
    saveAsset();
    editingIncomeId = '';
    renderKeepScroll();
    return true;
  }

  /* ============ 支出：保存 ============ */
  function saveExpenseFromSheet(){
    var name = (nameInput.value || '').trim();
    var amount = parseFloat(amountInput.value) || 0;
    var linkedId = linkedLiabilityInput.value || '';
    var linkedLiab = linkedId ? findLiabilityById(linkedId) : null;
    var linkedIsLoan = !!(linkedLiab && isLoanLiability(linkedLiab));
    var linkedSettled = !!(linkedLiab && !linkedIsLoan && liabRemain(linkedLiab) <= 0);

    if(!name){
      nameInput.classList.add('err');
      nameInput.focus();
      return false;
    }
    nameInput.classList.remove('err');

    if(!linkedSettled && amount <= 0){
      amountInput.classList.add('err');
      amountInput.focus();
      return false;
    }
    amountInput.classList.remove('err');

    if(linkedSettled){
      amount = 0;
    }

    if (linkedLiab && !linkedIsLoan && !linkedSettled) {
      var rem = liabRemain(linkedLiab);
      if (amount > rem) {
        amount = rem;
        amountInput.value = rem;
      }
    }

    var isMonthly = linkedIsLoan ? true : isMonthlyExpenseOn;

    var monthlyDay = 0;
    if(isMonthly){
      monthlyDay = parseInt(monthlyDayInput.value, 10) || 0;
      if(monthlyDay < 1 || monthlyDay > 31){
        monthlyDayInput.classList.add('err');
        monthlyDayInput.focus();
        return false;
      }
      monthlyDayInput.classList.remove('err');
    }

    if(editingExpenseId){
      var rec = null;
      for(var i = 0; i < demoExpenseMonthly.length; i++){
        if(demoExpenseMonthly[i].id === editingExpenseId){ rec = demoExpenseMonthly[i]; break; }
      }
      if(rec){
        rec.icon = selectedIcon;
        rec.name = name;
        if(linkedSettled){
          rec.amount = 0;
        } else {
          rec.amount = round2(amount);
        }

        if(!rec.monthly){
          if(!linkedSettled){
            generateExpenseLedger(rec, todayDateKey(), Date.now());
            if(linkedLiab && !linkedIsLoan){
              linkedLiab.paidAmount = round2((linkedLiab.paidAmount || 0) + round2(amount));
              saveLiability();
            }
          }
        } else {
          if(linkedLiab && linkedIsLoan){
            return false;
          } else if(linkedSettled){
            /* 已还清，仅保留删除，不改动 */
          } else if(linkedLiab){
            generateExpenseLedger(rec, todayDateKey(), Date.now());
            linkedLiab.paidAmount = round2((linkedLiab.paidAmount || 0) + round2(amount));
            saveLiability();
          } else {
            if(rec.monthlyDay !== monthlyDay){
              rec.monthlyDay = monthlyDay;
              rec.lastSettledDate = calcMonthlyInitialSettled(monthlyDay);
            }
          }
        }
      }
    } else {
      var newRec = {
        id: 'ex' + Date.now() + Math.floor(Math.random() * 1000),
        name: name,
        amount: round2(amount),
        monthly: isMonthly,
        monthlyDay: isMonthly ? monthlyDay : 0,
        linkedLiabilityId: linkedId,
        paidTotal: 0,
        createdAt: todayDateKey(),
        lastSettledDate: '',
        icon: selectedIcon
      };

      if(isMonthly){
        newRec.lastSettledDate = calcMonthlyInitialSettled(monthlyDay);
      } else {
        generateExpenseLedger(newRec, todayDateKey(), Date.now());
        if(linkedLiab && !linkedIsLoan){
          linkedLiab.paidAmount = round2((linkedLiab.paidAmount || 0) + round2(amount));
          saveLiability();
        }
      }

      demoExpenseMonthly.push(newRec);
    }

    saveExpense();
    editingExpenseId = '';
    renderKeepScroll();
    return true;
  }

  /* ============ 资产：保存 ============ */
  function saveAssetFromSheet(){
    var name = (nameInput.value || '').trim();

    } else {

  /* ============ 定期存款：保存 ============ */
  function saveDepositFromSheet(){
    var principal = parseFloat(amountInput.value) || 0;
    if(principal <= 0){
      amountInput.classList.add('err');
      amountInput.focus();
      return false;
    }
    amountInput.classList.remove('err');

    var years = parseInt(depositYearsInput.value, 10) || 0;

      depositYearsInput.style.boxShadow = 'inset 0 0 0 1.5px var(--red)';
      depositMonthsInput.style.boxShadow = 'inset 0 0 0 1.5px var(--red)';

    depositMonthsInput.style.boxShadow = '';

      depositRateInput.classList.add('err');
      depositRateInput.focus();
      return false;
    }

    var dep = {
      id: 'dp' + Date.now() + Math.floor(Math.random()*1000),
      principal: round2(principal),

      months: months,
      rate: rate,
      startDate: startDate,
      endDate: endDate,
      linkedIncomeId: 'cashflow',
      autoRenew: null,
      renewedFrom: '',
      createdAt: saveDate
    };
    demoDeposits.push(dep);
    saveDeposits();
    return true;
  }

  /* ============ 定期存款：利率在线编辑 ============ */
  function commitDepositRate(id, val){

      if(demoDeposits[i].id === id){ dep = demoDeposits[i]; break; }

  /* ============ 负债：保存 ============ */
  function findLiabilityById(id){
    for(var i = 0; i < demoLiability.length; i++){
      if(demoLiability[i].id === id) return demoLiability[i];
    }
    return null;
  }

  function replaceLiability(rec){
    for(var i = 0; i < demoLiability.length; i++){
      if(demoLiability[i].id === rec.id){
        demoLiability[i] = rec;
        return;
      }
    }
    demoLiability.push(rec);
  }

  function newLiabilityId(){
    return 'lb' + Date.now() + Math.floor(Math.random() * 1000);
  }

  function saveLiabilityFromSheet(){
    var name = (nameInput.value || '').trim();
    var type = isLoanLiabilityOn ? 'loan' : 'normal';
    var existing = editingLiabilityId ? findLiabilityById(editingLiabilityId) : null;

    if(!name){
      nameInput.classList.add('err');
      nameInput.focus();
      return false;
    }
    nameInput.classList.remove('err');

    if(type === 'loan'){
      var total = parseFloat(totalInput.value) || 0;
      var periods = parseInt(periodsInput.value, 10) || 0;
      var monthly = parseFloat(monthlyInput.value) || 0;
      var repayDay = parseInt(repayDayInput.value, 10) || 0;
      var borrowDate = borrowDateInput.value || todayDateKey();

      if(total <= 0){
        totalInput.classList.add('err');
        totalInput.focus();
        return false;
      }
      totalInput.classList.remove('err');

      if(periods <= 0){
        periodsInput.classList.add('err');
        periodsInput.focus();
        return false;
      }
      periodsInput.classList.remove('err');

      if(monthly <= 0) monthly = round2(total / periods);
      if(monthly <= 0){
        monthlyInput.classList.add('err');
        monthlyInput.focus();
        return false;
      }
      monthlyInput.classList.remove('err');

      if(repayDay < 1 || repayDay > 31) repayDay = 1;

      var loanRec = {
        id: existing ? existing.id : newLiabilityId(),
        name: name,
        type: 'loan',
        totalAmount: round2(total),
        periods: periods,
        monthlyPayment: round2(monthly),
        repayDay: repayDay,
        borrowDate: borrowDate,
        icon: selectedIcon
      };
      replaceLiability(loanRec);
    } else {
      var date = borrowDateInput.value || todayDateKey();
      var amt = parseFloat(amountInput.value) || 0;

      if(amt <= 0 && !existing){
        amountInput.classList.add('err');
        amountInput.focus();
        return false;
      }
      amountInput.classList.remove('err');

      var borrows = [];
      var paidAmount = 0;
      if(existing && existing.type !== 'loan'){
        borrows = (existing.borrows || []).map(function(b){
          return { date: b.date, amount: round2(b.amount) };
        });
        paidAmount = Number(existing.paidAmount) || 0;
      }

      if(amt > 0){
        var found = false;
        for(var i = 0; i < borrows.length; i++){
          if(borrows[i].date === date){
            borrows[i].amount = round2(amt);
            found = true;
            break;
          }
        }
        if(!found) borrows.push({ date: date, amount: round2(amt) });
        borrows.sort(function(a, b){ return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); });
      }

      var normalRec = {
        id: existing ? existing.id : newLiabilityId(),
        name: name,
        type: 'normal',
        borrows: borrows,
        paidAmount: paidAmount,
        icon: selectedIcon
      };
      replaceLiability(normalRec);
    }

    saveLiability();
    editingLiabilityId = '';
    renderKeepScroll();
    return true;
  }

      if(!selectedIcon){
        iconPicker.classList.add('err');
        iconPicker.hidden = false;
        if(iconFieldArrow) iconFieldArrow.textContent = '▾';
        return;
      }
      if(expenseEditNeedsConfirm && !expenseEditPending){
        expenseEditPending = true;
        editConfirmTip.hidden = false;
        return;
      }
      if(saveExpenseFromSheet()){
        closeSheet();
      }
      return;
    }
    closeSheet();
  });

      handleLiabilityDetailDelete();
      return;

    if(!pendingDeleteId) return;
    var val = (captchaInput.value || '').replace(/\D/g, '').slice(0, 4);

      currentCaptcha = genCaptcha();
      captchaText.textContent = currentCaptcha;
      captchaInput.value = '';
      try{ captchaInput.focus(); }catch(e){}
      return;

      saveIncome();
      editingIncomeId = '';

      editingExpenseId = '';
    } else {
      demoLiability = demoLiability.filter(function(x){ return x.id !== delId; });
      saveLiability();

  linkedLiabilityInput.addEventListener('change', function(){
    if(currentTab !== 'expense') return;
    applyLinkedLiability(this.value);
  });

  /* 普通负债：修改借款日期时金额清零 */
  borrowDateInput.addEventListener('change', function(){
    if(currentTab !== 'liability') return;
    if(isLoanLiabilityOn) return;
    amountInput.value = '';
  });

  function calcLoanMonthly(){
    if(currentTab === 'liability' && isLoanLiabilityOn){
      var total = parseFloat(totalInput.value) || 0;
      var periods = parseInt(periodsInput.value, 10) || 0;
      if(total > 0 && periods > 0){
        monthlyInput.value = round2(total / periods);
      }
    }
  }
  totalInput.addEventListener('input', calcLoanMonthly);
  periodsInput.addEventListener('input', calcLoanMonthly);

  /* ============ 内容点击交互 ============ */
  contentWrap.addEventListener('click', function(e){
    if(prevPanel.contains(e.target) || nextPanel.contains(e.target)) return;
    var target = e.target;

    if(suppressItemIconClick){
      suppressItemIconClick = false;
      return;
    }

    if(suppressQuickTagClick){
      suppressQuickTagClick = false;
      return;
    }

    /* 负债合计 ⫶ */
    var liabToggle = target.closest ? target.closest('#liabilityCalToggle') : null;
    if(liabToggle){
      liabilitySummaryExpanded = !liabilitySummaryExpanded;
      if(!liabilitySummaryExpanded){
        expandedLiabilityDetailId = '';
      }
      var stLiab = contentEl.scrollTop;
      render();
      contentEl.scrollTop = stLiab;
      return;
    }

    /* 负债明细项目名称（虚线）点击展开/收起 */
    var liabDetailToggleEl = target.closest ? target.closest('[data-liab-detail-toggle]') : null;
    if(liabDetailToggleEl){
      var detailId = liabDetailToggleEl.dataset.liabDetailToggle;
      expandedLiabilityDetailId = (expandedLiabilityDetailId === detailId) ? '' : detailId;
      var stLD = contentEl.scrollTop;
      render();
      contentEl.scrollTop = stLD;
      return;
    }

    /* 定期存款记录展开 */
    var depToggle = target.closest ? target.closest('[data-dep-toggle]') : null;
    if(depToggle){
      var depId = depToggle.dataset.depToggle;
      if(depositExpandedId !== depId) depositRateEditingId = '';
      depositExpandedId = (depositExpandedId === depId) ? '' : depId;
      var stDep = contentEl.scrollTop;
      render();
      contentEl.scrollTop = stDep;
      return;
    }

    /* 定期存款利率编辑 */
    var rateEditEl = target.closest ? target.closest('[data-dep-rate-edit]') : null;
    if(rateEditEl){
      depositRateEditingId = rateEditEl.dataset.depRateEdit;
      var stRate = contentEl.scrollTop;
      render();
      contentEl.scrollTop = stRate;
      setTimeout(function(){
        var inp = contentEl.querySelector('[data-dep-rate-input]');
        if(inp){
          try{ inp.focus(); inp.select(); }catch(err){}
        }
      }, 0);
      return;
    }

    /* 定期存款到期 */
    var renewBtn = target.closest ? target.closest('[data-dep-renew]') : null;
    if(renewBtn){
      var depId2 = renewBtn.dataset.depId;
      var choice = renewBtn.dataset.depRenew;
      var dep = demoDeposits.filter(function(x){ return x.id === depId2; })[0];
      if(dep){
        if(choice === 'yes'){
          dep.autoRenew = true;
          saveDeposits();
        } else if(choice === 'no'){
          var amt = depositMatureAmount(dep);
          addToCashAsset(amt);
          saveAsset();
          demoDeposits = demoDeposits.filter(function(x){ return x.id !== depId2; });
          saveDeposits();
        }
        var stRenew = contentEl.scrollTop;
        render();
        contentEl.scrollTop = stRenew;
      }
      return;
    }

    /* 资产合计 ⫶ */
    var assetToggle = target.closest ? target.closest('#assetCalToggle') : null;
    if(assetToggle){
      assetSummaryExpanded = !assetSummaryExpanded;
      if(!assetSummaryExpanded){
        depositExpandedId = '';
        depositRateEditingId = '';
      }
      var stAsset = contentEl.scrollTop;
      render();
      contentEl.scrollTop = stAsset;
      return;
    }

    /* 快捷标签 */
    var dailyTagBtn = target.closest ? target.closest('.daily-tag') : null;
    if(dailyTagBtn && currentTab === 'expense'){
      openQuickTagExpense(dailyTagBtn.dataset.tag);
      return;
    }

    var dailyAddBtn = target.closest ? target.closest('#dailyAddBtn') : null;
    if(dailyAddBtn && currentTab === 'expense'){
      openQuickTagAdd();
      return;
    }

    /* 支出合计切换 */
    var expenseTotalToggle = target.closest ? target.closest('#expenseTotalToggle') : null;
    if(expenseTotalToggle){
      expenseTotalMode = (expenseTotalMode === 'year') ? 'total' : 'year';
      var stET = contentEl.scrollTop;
      render();
      contentEl.scrollTop = stET;
      return;
    }

    /* 收入合计切换 */
    var incomeTotalToggle = target.closest ? target.closest('#incomeTotalToggle') : null;
    if(incomeTotalToggle){
      incomeTotalMode = (incomeTotalMode === 'year') ? 'total' : 'year';
      var stIT = contentEl.scrollTop;
      render();
      contentEl.scrollTop = stIT;
      return;
    }

    /* 收入明细展开 */
    var incToggle = target.closest ? target.closest('#incomeCalToggle') : null;
    if(incToggle){
      incomeSummaryExpanded = !incomeSummaryExpanded;
      if(!incomeSummaryExpanded){
        incomeSumMode = '';
        var nowI = new Date();
        incomeCalYear = nowI.getFullYear();
        incomeCalMonth = nowI.getMonth();
        incomeCalSelectedDate = todayDateKey();
      }
      var stInc = contentEl.scrollTop;
      render();
      contentEl.scrollTop = stInc;
      return;
    }

    var incSumBtn = target.closest ? target.closest('[data-inc-sum]') : null;
    if(incSumBtn){
      var incMode = incSumBtn.dataset.incSum;
      incomeSumMode = (incomeSumMode === incMode) ? '' : incMode;
      var stIncSum = contentEl.scrollTop;
      render();
      contentEl.scrollTop = stIncSum;
      return;
    }

    var incCalNav = target.closest ? target.closest('[data-inc-cal]') : null;
    if(incCalNav){
      var actInc = incCalNav.dataset.incCal;
      if(actInc === 'prev-year') incomeCalYear--;
      else if(actInc === 'next-year') incomeCalYear++;
      else if(actInc === 'prev-month'){ incomeCalMonth--; if(incomeCalMonth < 0){ incomeCalMonth = 11; incomeCalYear--; } }
      else if(actInc === 'next-month'){ incomeCalMonth++; if(incomeCalMonth > 11){ incomeCalMonth = 0; incomeCalYear++; } }

      var nowInc = new Date();
      if(incomeCalYear === nowInc.getFullYear() && incomeCalMonth === nowInc.getMonth()){
        incomeCalSelectedDate = todayDateKey();
      } else {
        var dInc = Math.min(nowInc.getDate(), new Date(incomeCalYear, incomeCalMonth + 1, 0).getDate());
        incomeCalSelectedDate = ymdKey(incomeCalYear, incomeCalMonth) + '-' + pad2(dInc);
      }

      var stIncNav = contentEl.scrollTop;
      render();
      contentEl.scrollTop = stIncNav;
      return;
    }

    var incCalCell = target.closest ? target.closest('[data-inc-date]') : null;
    if(incCalCell){
      incomeCalSelectedDate = incCalCell.dataset.incDate;
      var stIncCell = contentEl.scrollTop;
      render();
      contentEl.scrollTop = stIncCell;
      return;
    }

    /* 负债项图标点击：恢复展开功能（图标 z-index 高于 borrow-toggle-area，需在此处理） */
    var iconClickEl = target.closest ? target.closest('.item-icon') : null;
    if(iconClickEl && currentTab === 'liability'){
      var iconLiabEl = iconClickEl.closest ? iconClickEl.closest('.item') : null;
      if(iconLiabEl && iconLiabEl.dataset.id){
        var liabByIcon = findLiabilityById(iconLiabEl.dataset.id);
        if(liabByIcon && !isLoanLiability(liabByIcon)){
          expandedLiabilityId = (expandedLiabilityId === liabByIcon.id) ? '' : liabByIcon.id;
          var stIc = contentEl.scrollTop;
          render();
          contentEl.scrollTop = stIc;
          return;
        }
      }
    }

    /* 负债展开 */
    var borrowToggleArea = target.closest ? target.closest('.borrow-toggle-area') : null;
    if(borrowToggleArea){
      var lid = borrowToggleArea.dataset.id;
      expandedLiabilityId = (expandedLiabilityId === lid) ? '' : lid;
      var st = contentEl.scrollTop;
      render();
      contentEl.scrollTop = st;
      return;
    }

    /* 支出日历展开 */
    var calToggle = target.closest ? target.closest('.cal-toggle') : null;
    if(calToggle && calToggle.id !== 'incomeCalToggle' && calToggle.id !== 'assetCalToggle' && calToggle.id !== 'liabilityCalToggle'){
      calendarExpanded = !calendarExpanded;
      if(!calendarExpanded){
        calSumMode = '';
        var now = new Date();
        calYear = now.getFullYear();
        calMonth = now.getMonth();
        calSelectedDate = todayDateKey();
      }
      var st0 = contentEl.scrollTop;
      render();
      contentEl.scrollTop = st0;
      return;
    }

    var sumBtn = target.closest ? target.closest('.cal-total[data-sum]') : null;
    if(sumBtn){
      var mode = sumBtn.dataset.sum;
      calSumMode = (calSumMode === mode) ? '' : mode;
      var stSum = contentEl.scrollTop;
      render();
      contentEl.scrollTop = stSum;
      return;
    }

    var calNav = target.closest ? target.closest('.cal-nav') : null;
    if(calNav){
      var act = calNav.dataset.cal;
      if(act === 'prev-year') calYear--;
      else if(act === 'next-year') calYear++;
      else if(act === 'prev-month'){ calMonth--; if(calMonth < 0){ calMonth = 11; calYear--; } }
      else if(act === 'next-month'){ calMonth++; if(calMonth > 11){ calMonth = 0; calYear++; } }

      var now2 = new Date();
      if(calYear === now2.getFullYear() && calMonth === now2.getMonth()){
        calSelectedDate = todayDateKey();
      } else {
        var d2 = Math.min(now2.getDate(), new Date(calYear, calMonth + 1, 0).getDate());
        calSelectedDate = ymdKey(calYear, calMonth) + '-' + pad2(d2);
      }

      var st1 = contentEl.scrollTop;
      render();
      contentEl.scrollTop = st1;
      return;
    }

    var calCell = target.closest ? target.closest('.cal-cell') : null;
    if(calCell && calCell.dataset.date){
      calSelectedDate = calCell.dataset.date;
      var stCal = contentEl.scrollTop;
      render();
      contentEl.scrollTop = stCal;
      return;
    }

    /* 今日支出展开 */
    var dailyItem = target.closest ? target.closest('.daily-expense-item') : null;
    if(dailyItem){
      dailyExpanded = !dailyExpanded;
      var st2 = contentEl.scrollTop;
      render();
      contentEl.scrollTop = st2;
      return;
    }

    /* 列表项打开编辑弹窗 */
    var itemEl = target.closest ? target.closest('.item') : null;
    if(!itemEl) return;
    var id = itemEl.dataset.id;
    if(!id) return;

    /* 今日支出项不打开编辑 */
    if(id === 'today_expense') return;

    if(currentTab === 'asset' && id === 'deposit_fixed'){
      openDepositEditor();
      return;
    }

    var pool = [];
    if(currentTab === 'income') pool = demoIncome;
    else if(currentTab === 'expense') pool = demoExpenseMonthly;
    else if(currentTab === 'asset') pool = demoAsset;
    else if(currentTab === 'liability') pool = demoLiability;

    var item = pool.filter(function(x){ return x.id === id; })[0];
    if(!item) return;
    openEditor(item);
  });

  /* 定期存款利率输入提交 */
  contentWrap.addEventListener('change', function(e){
    var inp = e.target && e.target.closest ? e.target.closest('[data-dep-rate-input]') : null;
    if(inp){
      commitDepositRate(inp.dataset.depRateInput, inp.value);
    }
  });
  contentWrap.addEventListener('focusout', function(e){
    var inp = e.target && e.target.closest ? e.target.closest('[data-dep-rate-input]') : null;
    if(inp){
      if(depositRateEditingId === inp.dataset.depRateInput){
        commitDepositRate(inp.dataset.depRateInput, inp.value);
      }
    }
  });
  contentWrap.addEventListener('keydown', function(e){
    var inp = e.target && e.target.closest ? e.target.closest('[data-dep-rate-input]') : null;
    if(inp && (e.key === 'Enter' || e.keyCode === 13)){
      if(e.cancelable) e.preventDefault();
      try{ inp.blur(); }catch(err){}
    }
  });

  /* ============ 日期变化定时自动结算 ============ */
  setInterval(function(){
    var incChanged = autoSettleIncome();
    var expChanged = autoSettleExpense();
    var depChanged = processDepositMaturity();
    if((incChanged || expChanged || depChanged) && !maskEl.classList.contains('show')){
      renderKeepScroll();
    }
  }, 60000);

  /* 初始化 */
  render();

})();
</script>
</body>
</html>
